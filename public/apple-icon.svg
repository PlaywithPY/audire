<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background -->
  <rect width="100" height="100" fill="#2C5F8D" rx="20"/>

  <!-- Sound wave design representing hearing/audio -->
  <g fill="white">
    <!-- Center dot (sound source) -->
    <circle cx="35" cy="50" r="4"/>

    <!-- Sound waves -->
    <path d="M 50 35 Q 55 42.5, 50 50 Q 55 57.5, 50 65"
          stroke="white"
          stroke-width="3"
          fill="none"
          stroke-linecap="round"/>

    <path d="M 60 25 Q 68 37.5, 60 50 Q 68 62.5, 60 75"
          stroke="white"
          stroke-width="3"
          fill="none"
          stroke-linecap="round"/>

    <path d="M 70 15 Q 81 32.5, 70 50 Q 81 67.5, 70 85"
          stroke="white"
          stroke-width="3"
          fill="none"
          stroke-linecap="round"/>
  </g>
</svg>
