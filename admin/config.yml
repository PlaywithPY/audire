# Configuration Decap CMS pour Audire
backend:
  name: github
  repo: PlaywithPY/audire
  branch: main

publish_mode: editorial_workflow
media_folder: "images/uploads"
public_folder: "/audire/images/uploads"
locale: fr

collections:
  # =========================
  # CONFIGURATION GLOBALE
  # =========================
  - name: "config"
    label: "⚙️ Configuration"
    files:
      - name: "config"
        label: "📞 Contact & Informations"
        file: "content/config.json"
        fields:
          - label: "Contact"
            name: "contact"
            widget: "object"
            fields:
              - label: "Téléphone"
                name: "phone"
                widget: "object"
                fields:
                  - {label: "Affichage", name: "display", widget: "string"}
                  - {label: "Lien (format +32...)", name: "href", widget: "string"}
              - {label: "Email", name: "email", widget: "string"}
              - label: "Adresse"
                name: "address"
                widget: "object"
                fields:
                  - {label: "Rue", name: "street", widget: "string"}
                  - {label: "Code postal", name: "postalCode", widget: "string"}
                  - {label: "Ville", name: "city", widget: "string"}
                  - {label: "Région", name: "region", widget: "string"}
                  - {label: "Pays", name: "country", widget: "string"}

  # =========================
  # PAGES DU SITE
  # =========================
  - name: "pages"
    label: "📄 Pages"
    files:
      # ========================================
      # PAGE D'ACCUEIL
      # ========================================
      - name: "home"
        label: "🏠 Page d'accueil"
        file: "content/pages/home.json"
        fields:
          - label: "Section Hero"
            name: "hero"
            widget: "object"
            fields:
              - {label: "Kicker (petit texte au-dessus)", name: "kicker", widget: "string"}
              - {label: "Titre principal", name: "title", widget: "string"}
              - {label: "Sous-titre", name: "subtitle", widget: "text"}
              - {label: "Chips (liste de points)", name: "chips", widget: "list", field: {label: "Texte", name: "text", widget: "string"}}
              - {label: "Note (texte 'Vous hésitez?')", name: "note", widget: "text"}

          - label: "Section CTA finale"
            name: "cta"
            widget: "object"
            fields:
              - {label: "Titre", name: "title", widget: "string"}
              - {label: "Description", name: "description", widget: "text"}

      # ========================================
      # PAGE TEST AUDITIF
      # ========================================
      - name: "test-auditif-gratuit"
        label: "👂 Page Test Auditif Gratuit"
        file: "content/pages/test-auditif-gratuit.json"
        fields:
          - label: "Section Hero"
            name: "hero"
            widget: "object"
            fields:
              - {label: "Kicker", name: "kicker", widget: "string"}
              - {label: "Titre", name: "title", widget: "string"}
              - {label: "Sous-titre", name: "subtitle", widget: "text"}
              - {label: "Chips", name: "chips", widget: "list", field: {label: "Texte", name: "text", widget: "string"}}

          - label: "Section CTA"
            name: "cta"
            widget: "object"
            collapsed: true
            fields:
              - {label: "Titre", name: "title", widget: "string"}
              - {label: "Description", name: "description", widget: "text"}

      # ========================================
      # PAGE NOTRE ACCOMPAGNEMENT
      # ========================================
      - name: "notre-accompagnement"
        label: "🤝 Page Notre Accompagnement"
        file: "content/pages/notre-accompagnement.json"
        fields:
          - label: "Section Hero"
            name: "hero"
            widget: "object"
            fields:
              - {label: "Kicker", name: "kicker", widget: "string"}
              - {label: "Titre", name: "title", widget: "string"}

          - label: "Section CTA"
            name: "cta"
            widget: "object"
            fields:
              - {label: "Titre", name: "title", widget: "string"}
              - {label: "Description", name: "description", widget: "text"}

      # ========================================
      # PAGE SOLUTIONS AUDITIVES
      # ========================================
      - name: "solutions-auditives"
        label: "🎧 Page Solutions Auditives"
        file: "content/pages/solutions-auditives.json"
        fields:
          - label: "Section Hero"
            name: "hero"
            widget: "object"
            fields:
              - {label: "Kicker", name: "kicker", widget: "string"}
              - {label: "Titre", name: "title", widget: "string"}

          - label: "Section CTA"
            name: "cta"
            widget: "object"
            fields:
              - {label: "Titre", name: "title", widget: "string"}
              - {label: "Description", name: "description", widget: "text"}

      # ========================================
      # PAGE REMBOURSEMENTS
      # ========================================
      - name: "remboursements"
        label: "💰 Page Remboursements"
        file: "content/pages/remboursements.json"
        fields:
          - label: "Section Hero"
            name: "hero"
            widget: "object"
            fields:
              - {label: "Kicker", name: "kicker", widget: "string"}
              - {label: "Titre", name: "title", widget: "string"}
              - {label: "Sous-titre", name: "subtitle", widget: "text", required: false}

          - label: "Section CTA"
            name: "cta"
            widget: "object"
            fields:
              - {label: "Titre", name: "title", widget: "string"}
              - {label: "Description", name: "description", widget: "text"}

      # ========================================
      # PAGE FAQ
      # ========================================
      - name: "faq"
        label: "❓ Page FAQ"
        file: "content/pages/faq.json"
        fields:
          - label: "Section Hero"
            name: "hero"
            widget: "object"
            fields:
              - {label: "Kicker", name: "kicker", widget: "string"}
              - {label: "Titre", name: "title", widget: "string"}
              - {label: "Sous-titre", name: "subtitle", widget: "text", required: false}

          - label: "Section CTA"
            name: "cta"
            widget: "object"
            fields:
              - {label: "Titre", name: "title", widget: "string"}
              - {label: "Description", name: "description", widget: "text"}

      # ========================================
      # PAGE CONTACT
      # ========================================
      - name: "contact"
        label: "📍 Page Contact"
        file: "content/pages/contact.json"
        fields:
          - label: "Section Hero"
            name: "hero"
            widget: "object"
            fields:
              - {label: "Kicker", name: "kicker", widget: "string"}
              - {label: "Titre", name: "title", widget: "string"}
              - {label: "Sous-titre", name: "subtitle", widget: "text", required: false}

      # ========================================
      # PAGE PARTENAIRES PHARMACIENS
      # ========================================
      - name: "partenaires-pharmaciens"
        label: "💊 Page Partenaires Pharmaciens"
        file: "content/pages/partenaires-pharmaciens.json"
        fields:
          - label: "Section Hero"
            name: "hero"
            widget: "object"
            fields:
              - {label: "Kicker", name: "kicker", widget: "string"}
              - {label: "Titre", name: "title", widget: "string"}
              - {label: "Sous-titre", name: "subtitle", widget: "text", required: false}

          - label: "Section CTA"
            name: "cta"
            widget: "object"
            fields:
              - {label: "Titre", name: "title", widget: "string"}
              - {label: "Description", name: "description", widget: "text"}
